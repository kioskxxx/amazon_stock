<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>亚马逊备货管理登录</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-container {
    background: #fff;
    padding: 30px 40px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    width: 320px;
}

.login-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.login-container input {
    width: 100%;
    padding: 10px 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

.login-container button {
    width: 100%;
    padding: 10px 12px;
    margin-top: 15px;
    background-color: #4caf50;
    color: white;
    border: none;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
}

.login-container button:hover {
    background-color: #45a049;
}

#errorMsg {
    color: red;
    text-align: center;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="login-container">

    <h2>亚马逊备货登录</h2>

    <input
        type="text"
        id="username"
        placeholder="用户名"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="密码"
        autocomplete="current-password"
    >

    <button onclick="login()">登录</button>

    <div id="errorMsg"></div>

</div>

<script>

// ==============================
// Cloudflare Worker API 地址
// ==============================
const API_URL = 'https://amazon-stock.seakyant.workers.dev/';


// ==============================
// 登录
// ==============================
async function login() {

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    // 清除之前的错误信息
    errorMsg.innerText = '';

    // 检查输入
    if (!username || !password) {
        errorMsg.innerText = '请填写用户名和密码';
        return;
    }

    try {

        // 发送登录请求到 Cloudflare Worker
        const res = await fetch(API_URL, {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                action: 'login',
                username: username,
                password: password
            })
        });


        // 尝试读取 JSON
        let data;

        try {
            data = await res.json();
        } catch (e) {
            errorMsg.innerText = '服务器返回的数据格式错误';
            return;
        }


        // 登录成功
        if (res.ok && data.ok) {

            // 保存 Worker 返回的 Token
            localStorage.setItem('token', data.token);

            // 登录成功后进入 index.html
            window.location.href = 'index.html';

            return;
        }


        // 登录失败
        errorMsg.innerText = data.error || '账号或密码错误';

    } catch (e) {

        // 网络错误
        errorMsg.innerText = '网络错误: ' + e.message;

    }
}

</script>

</body>
</html>
